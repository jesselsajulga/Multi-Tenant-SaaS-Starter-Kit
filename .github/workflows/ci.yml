name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: saas_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://root:rootpassword@localhost:5432/saas_test_db?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "test-jwt-secret-do-not-use-in-prod"
      STRIPE_SECRET_KEY: "sk_test_fake_key_for_ci"
      STRIPE_WEBHOOK_SECRET: "whsec_fake_key_for_ci"
      GOOGLE_CLIENT_ID: "fake-client-id"
      GOOGLE_CLIENT_SECRET: "fake-client-secret"
      FRONTEND_URL: "http://localhost:3000"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: |
          apps/api/package-lock.json
          apps/web/package-lock.json

    - name: Install dependencies for api
      run: npm install
      working-directory: ./apps/api

    - name: Install dependencies for web
      run: npm install
      working-directory: ./apps/web

    - name: Generate Prisma Client & Push Schema
      working-directory: ./apps/api
      run: |
        npx prisma generate
        npm run db:setup
        npx prisma migrate deploy
        npm run db:setup

    - name: Build API
      working-directory: ./apps/api
      run: npm run build

    - name: Build Web
      working-directory: ./apps/web
      run: npm run build

    - name: Run API Tests (Vitest + Supertest)
      working-directory: ./apps/api
      run: npm test
